startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      rapidApiKey:
        type: string
        description: RapidAPI Key for NEOMA P-CAM Enclave (Leave as 'guest' for evaluation)
        default: "guest"
  command: python
  args:
    - "mcp_server.py"
  env:
    RAPIDAPI_KEY: config.rapidApiKey
