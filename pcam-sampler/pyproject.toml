[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcam-sampler"
version = "1.0.1"
description = "D-Wave Ocean SDK compatible In-Material Physical Solver for NEOMA P-CAM"
readme = "README.md"
authors = [
    { name = "NEOMA Lab", email = "engineering@neoma-pcam.com" }
]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "dimod>=0.12.0",
    "requests>=2.28.0"
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/neoma-pcam/pcam-live"
Documentation = "https://neoma-pcam.github.io/pcam-live/"
Gateway = "https://rapidapi.com/shs15199702/api/neoma-p-cam-hyper-physical-control"
